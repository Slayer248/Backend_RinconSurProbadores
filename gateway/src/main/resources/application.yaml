server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: roles-ms
          uri: lb://ROLES-SERVICE
          predicates:
            - Path=/api/roles/**

        - id: usuarios-ms
          uri: lb://USUARIOS-SERVICE
          predicates:
            - Path=/api/usuarios/**

        - id: probadores-ms
          uri: lb://PROBADORES-SERVICE
          predicates:
            - Path=/api/probadores/**

        - id: turnos-ms
          uri: lb://TURNOS-SERVICE
          predicates:
            - Path=/api/turnos/**

        - id: cuentas-inhabilitadas-ms
          uri: lb://CUENTAS-INHABILITADAS-SERVICE
          predicates:
            - Path=/api/cuentas-inhabilitadas/**

        - id: probadores-inhabilitados-ms
          uri: lb://PROBADORES-INHABILITADOS-SERVICE
          predicates:
            - Path=/api/probadores-inhabilitados/**

        - id: roles-docs
          uri: lb://ROLES-SERVICE
          predicates:
            - Path=/docs/roles/v3/api-docs/**
          filters:
            - RewritePath=/docs/roles/v3/api-docs(?<segment>/?.*), /v3/api-docs$\{segment}

        - id: usuarios-docs
          uri: lb://USUARIOS-SERVICE
          predicates:
            - Path=/docs/usuarios/v3/api-docs/**
          filters:
            - RewritePath=/docs/usuarios/v3/api-docs(?<segment>/?.*), /v3/api-docs$\{segment}

        - id: probadores-docs
          uri: lb://PROBADORES-SERVICE
          predicates:
            - Path=/docs/probadores/v3/api-docs/**
          filters:
            - RewritePath=/docs/probadores/v3/api-docs(?<segment>/?.*), /v3/api-docs$\{segment}

        - id: turnos-docs
          uri: lb://TURNOS-SERVICE
          predicates:
            - Path=/docs/turnos/v3/api-docs/**
          filters:
            - RewritePath=/docs/turnos/v3/api-docs(?<segment>/?.*), /v3/api-docs$\{segment}

        - id: cuentas-inhabilitadas-docs
          uri: lb://CUENTAS-INHABILITADAS-SERVICE
          predicates:
            - Path=/docs/cuentas-inhabilitadas/v3/api-docs/**
          filters:
            - RewritePath=/docs/cuentas-inhabilitadas/v3/api-docs(?<segment>/?.*), /v3/api-docs$\{segment}

        - id: probadores-inhabilitados-docs
          uri: lb://PROBADORES-INHABILITADOS-SERVICE
          predicates:
            - Path=/docs/probadores-inhabilitados/v3/api-docs/**
          filters:
            - RewritePath=/docs/probadores-inhabilitados/v3/api-docs(?<segment>/?.*), /v3/api-docs$\{segment}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Roles
        url: /docs/roles/v3/api-docs
      - name: Usuarios
        url: /docs/usuarios/v3/api-docs
      - name: Probadores
        url: /docs/probadores/v3/api-docs
      - name: Turnos
        url: /docs/turnos/v3/api-docs
      - name: Cuentas inhabilitadas
        url: /docs/cuentas-inhabilitadas/v3/api-docs
      - name: Probadores inhabilitados
        url: /docs/probadores-inhabilitados/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: "*"