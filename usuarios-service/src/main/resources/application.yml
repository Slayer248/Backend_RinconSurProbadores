server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: usuarios-service
  config:
    # Carga secretos locales desde .env (funciona al ejecutar desde usuarios-service o desde la raíz del backend)
    import: "optional:file:.env[.properties],optional:file:usuarios-service/.env[.properties]"
  datasource:
    url: jdbc:mysql://localhost:3306/rinconsur_usuarios?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  web:
    error:
      include-message: always
  cloud:
    compatibility-verifier:
      enabled: false
  mail:
    host: smtp.gmail.com
    port: 587
    # Credenciales fuera del repositorio: se leen de variables de entorno o del archivo .env (ignorado por git)
    username: ${MAIL_USERNAME:soporte.rinconsur@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

roles:
  service:
    url: http://localhost:8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    status-page-url-path: /swagger-ui.html