server:
  port: 8084
  forward-headers-strategy: framework

spring:
  application:
    name: turnos-service
  datasource:
    url: jdbc:mysql://localhost:3306/rinconsur_turnos?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  web:
    error:
      include-message: always
  cloud:
    compatibility-verifier:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    status-page-url-path: /swagger-ui.html