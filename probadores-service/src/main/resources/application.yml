server:
  port: 8083
  forward-headers-strategy: framework

spring:
  application:
    name: probadores-service
  datasource:
    url: jdbc:mysql://localhost:3306/rinconsur_probadores?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  web:
    error:
      include-message: always
  cloud:
    compatibility-verifier:
      enabled: false

turnos:
  service:
    url: http://localhost:8084

probadores-inhabilitados:
  service:
    url: http://localhost:8086

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    status-page-url-path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: "*"